<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="npc-dialogue-title npc-dialogue-desc">
<title id="npc-dialogue-title">NPC DIALOGUE — Lighthaven wireframe</title><desc id="npc-dialogue-desc">Actual NPC / authored topic IDs • no UI-owned rewards. Layout specification only. Unknown values are not zero. All actionable controls have keyboard and gamepad equivalents in the paired Markdown specification.</desc>
<style>
.bg{fill:#171717}.panel{fill:#242424;stroke:#909090;stroke-width:2}.raised,.button{fill:#333333;stroke:#909090;stroke-width:2}.focus{fill:#333333;stroke:#E9BF79;stroke-width:3}.rule{fill:none;stroke:#909090;stroke-width:2}.guide{fill:none;stroke:#909090;stroke-width:1;stroke-dasharray:9 12}.body,.muted,.small,.heading,.title,.amber,.cool{font-family:'Liberation Sans',sans-serif;fill:#F2F2F2;font-size:30px}.muted{fill:#C4C4C4}.small{font-size:24px;fill:#C4C4C4}.heading{font-size:36px;font-weight:bold}.title{font-size:48px;font-weight:bold}.amber{fill:#E9BF79}.cool{fill:#A9C4CC}
</style>
