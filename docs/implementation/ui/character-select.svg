<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="character-select-title character-select-desc">
<title id="character-select-title">CHARACTERS — Lighthaven wireframe</title><desc id="character-select-desc">Local profiles • selected recovery state. Layout specification only. Unknown values are not zero. All actionable controls have keyboard and gamepad equivalents in the paired Markdown specification.</desc>
<style>
.bg{fill:#171717}.panel{fill:#242424;stroke:#909090;stroke-width:2}.raised,.button{fill:#333333;stroke:#909090;stroke-width:2}.focus{fill:#333333;stroke:#E9BF79;stroke-width:3}.rule{fill:none;stroke:#909090;stroke-width:2}.guide{fill:none;stroke:#909090;stroke-width:1;stroke-dasharray:9 12}.body,.muted,.small,.heading,.title,.amber,.cool{font-family:'Liberation Sans',sans-serif;fill:#F2F2F2;font-size:30px}.muted{fill:#C4C4C4}.small{font-size:24px;fill:#C4C4C4}.heading{font-size:36px;font-weight:bold}.title{font-size:48px;font-weight:bold}.amber{fill:#E9BF79}.cool{fill:#A9C4CC}
</style>
<rect class="bg" width="1920" height="1080"/><rect x="72" y="54" width="1776" height="972" class="guide"/>
<text x="96" y="110" class="title">CHARACTERS</text><text x="96" y="150" class="small">Local profiles • selected recovery state</text>
<rect x="72" y="174" width="576" height="720" rx="6" class="panel"/><text x="96" y="228" class="heading">Your characters</text><rect x="96" y="270" width="528" height="72" rx="6" class="focus"/><text x="114" y="314" class="body">› Selected character</text><text x="120" y="390" class="body">Level — Unknown</text><text x="120" y="438" class="body">Temple district</text><text x="120" y="486" class="body">! Earlier save available</text><rect x="96" y="570" width="528" height="72" rx="6" class="button"/><text x="114" y="614" class="body">Another character</text><text x="120" y="690" class="small">Profile names are placeholders</text><rect x="96" y="798" width="528" height="72" rx="6" class="button"/><text x="120" y="844" class="body">New Character</text><rect x="672" y="174" width="1176" height="720" rx="6" class="panel"/><text x="696" y="228" class="heading">Selected character</text><text x="696" y="294" class="body">Level — Unknown    •    Saved area from record</text><text x="696" y="336" class="body">Ruleset / revision supplied by save owner</text><rect x="696" y="390" width="1128" height="180" rx="6" class="raised"/><text x="720" y="432" class="body">! Earlier save available</text><text x="720" y="474" class="body">The newest save could not be read.</text><text x="720" y="516" class="body">Progress after the earlier save may be lost.</text><text x="696" y="630" class="body">Recovered save time / sequence: owner-provided</text><text x="696" y="672" class="body">Your save files are kept until you choose an action.</text><rect x="696" y="702" width="1128" height="72" rx="6" class="button"/><text x="720" y="748" class="body">Details</text><rect x="696" y="798" width="744" height="72" rx="6" class="button"/><text x="720" y="844" class="body">Continue recovered save</text><rect x="1464" y="798" width="360" height="72" rx="6" class="button"/><text x="1488" y="844" class="body">Delete</text>
<text x="96" y="936" class="body">Recovery requires acknowledgment before world input is enabled</text>
<rect x="72" y="954" width="1776" height="72" rx="6" class="raised"/><text x="96" y="1000" class="small">[A] Select / Confirm     [B] Back     [Y] Details     [LT/RT] Page</text>
</svg>
